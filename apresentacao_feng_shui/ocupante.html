<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background: #E8D0A9;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #000000;
        display: flex;
        flex-direction: column;
        padding: 40px;
      }
      .title {
        font-size: 36px;
        font-weight: bold;
        margin-bottom: 30px;
        color: #4D6160;
        text-align: center;
      }
      .content {
        display: flex;
        flex-direction: row;
        justify-content: center;
        flex: 1;
      }
      .profile-box {
        background: rgba(184, 115, 51, 0.15);
        border-radius: 10px;
        padding: 30px;
        width: 70%;
      }
      .profile-header {
        display: flex;
        align-items: center;
        margin-bottom: 30px;
      }
      .profile-icon {
        background: #4D6160;
        color: #E8D0A9;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 25px;
      }
      .profile-icon i {
        font-size: 40px;
      }
      .profile-name {
        font-size: 28px;
        font-weight: bold;
        color: #A52A2A;
      }
      .profile-details {
        display: flex;
        flex-wrap: wrap;
      }
      .detail-item {
        display: flex;
        align-items: center;
        width: 50%;
        margin-bottom: 20px;
      }
      .detail-icon {
        color: #4D6160;
        margin-right: 15px;
        font-size: 24px;
        width: 30px;
      }
      .detail-text {
        font-size: 20px;
      }
      .footer {
        font-size: 18px;
        margin-top: 30px;
        text-align: center;
        color: #4D6160;
      }
    </style>
  </head>
  <body>
    <div class="slide-container">
      <h1 class="title">Dados do Ocupante Principal</h1>
      
      <div class="content">
        <div class="profile-box">
          <div class="profile-header">
            <div class="profile-icon">
              <i class="fas fa-user"></i>
            </div>
            <h2 class="profile-name">Gabriel de Souza Jaccoud Cardoso</h2>
          </div>
          
          <div class="profile-details">
            <div class="detail-item">
              <i class="fas fa-calendar-alt detail-icon"></i>
              <span class="detail-text"><strong>Data de nascimento:</strong> 10 de outubro de 1980</span>
            </div>
            
            <div class="detail-item">
              <i class="fas fa-venus-mars detail-icon"></i>
              <span class="detail-text"><strong>Gênero:</strong> Masculino</span>
            </div>
            
            <div class="detail-item">
              <i class="fas fa-map-marker-alt detail-icon"></i>
              <span class="detail-text"><strong>Local de nascimento:</strong> Niterói, RJ</span>
            </div>
            
            <div class="detail-item">
              <i class="fas fa-home detail-icon"></i>
              <span class="detail-text"><strong>Futuro endereço:</strong> Rio das Ostras, RJ</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="footer">
        <p>Dados utilizados para os cálculos BaZi (Quatro Pilares) e Kua (Ba Zhai)</p>
      </div>
    </div>
  </body>
</html>
